<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BigBubble</title>
<!-- Favicon como SVG embebido: se ve igual en todos los navegadores/SO, sin depender
     de que la plataforma tenga instalada una fuente de emojis. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='16' r='11' fill='%231d9bf0'/%3E%3Ccircle cx='23' cy='11' r='6' fill='%2300ba7c'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <a href="#/" class="brand">
    <svg class="brand-icon" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="13" cy="16" r="11" fill="#1d9bf0"/>
      <circle cx="23" cy="11" r="6" fill="#00ba7c"/>
    </svg>
    <span>BigBubble</span>
  </a>

  <div class="search-box">
    <svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="search-input" placeholder="Buscar personas..." aria-label="Buscar personas" />
    <div id="search-results" class="search-results hidden"></div>
  </div>

  <div class="topbar-actions" id="topbar-actions"></div>
</header>

<main class="container">

  <!-- Formularios de login/registro -->
  <section id="auth-forms" class="card">
    <div class="tabs">
      <button id="tab-login" class="tab active">Iniciar sesión</button>
      <button id="tab-register" class="tab">Registrarse</button>
    </div>

    <form id="login-form" class="form">
      <input type="text" id="login-username" placeholder="Usuario" autocomplete="username" required />
      <input type="password" id="login-password" placeholder="Contraseña" autocomplete="current-password" required />
      <button type="submit">Entrar</button>
      <p class="error" id="login-error"></p>
    </form>

    <form id="register-form" class="form hidden">
      <input type="text" id="reg-username" placeholder="Usuario (sin espacios)" autocomplete="username" required />
      <input type="text" id="reg-displayname" placeholder="Nombre para mostrar" required />
      <input type="email" id="reg-email" placeholder="Email" autocomplete="email" required />
      <input type="password" id="reg-password" placeholder="Contraseña (mín. 8 caracteres)" autocomplete="new-password" required />
      <button type="submit">Crear cuenta</button>
      <p class="error" id="register-error"></p>
    </form>
  </section>

  <!-- Panel de notificaciones -->
  <section id="notif-panel" class="card hidden"></section>

  <!-- Vista de perfil -->
  <section id="profile-view" class="hidden"></section>

  <!-- Composer de bubbles (solo en el timeline principal) -->
  <section id="composer" class="card hidden">
    <textarea id="bubble-content" maxlength="280" placeholder="¿Qué está pasando?"></textarea>
    <div class="composer-footer">
      <span id="char-count">280</span>
      <button id="post-btn">Bubblear</button>
    </div>
  </section>

  <!-- Timeline -->
  <section id="timeline"></section>

</main>

<script>window.BIGBUBBLE_API_URL = "https://bigbubble-backend.onrender.com/api";</script>
<script src="app.js"></script>
</body>
</html>
